name: Server Deploy

# workflow_dispatch 최초 수동 배포 성공(2026-08-04) 후 kista-api/fida와 동일하게 push:main 자동 배포로 전환.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: /opt/kista-ui

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: verify
    # 실측: 정상 8~9분. QEMU arm64 에뮬레이션이 간헐적으로 "Illegal instruction"으로
    # 크래시한 뒤 job이 실패 처리되지 않고 무한 대기한 사례가 있어(2026-08-04, 취소 전까지 29분+
    # 점유) 타임아웃을 명시한다 — 정상 소요 대비 2배 이상 여유
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.image }}
      latest: ${{ steps.image.outputs.latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image name
        id: image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${repo}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load public NEXT_PUBLIC_* build values
        # NEXT_PUBLIC_* 9개는 클라이언트 번들에 그대로 노출되는 공개값이라 평문 파일로 레포에 커밋되어 있음(.env.production.public) —
        # 더 이상 GitHub Secrets를 참조하지 않고 파일에서 읽어 GITHUB_ENV로 로드한다.
        # 주석/빈 줄은 GITHUB_ENV 파서가 KEY=VALUE 형식이 아니면 거부하므로 반드시 걸러낸다.
        # 값이 비어 있으면(레포 커밋 시점 플레이스홀더 그대로 방치된 경우) 클라이언트 번들에 빈 값이 조용히
        # 인라인되는 사고를 막기 위해 빌드 자체를 실패시킨다 — 실제 값은 사용자가 .env.production.public을
        # 직접 채워야 한다.
        run: |
          grep -vE '^[[:space:]]*(#|$)' .env.production.public >> "$GITHUB_ENV"
          while IFS='=' read -r k v; do
            [ -n "$v" ] || { echo "::error::.env.production.public 값 미기입: ${k}"; exit 1; }
          done < <(grep -vE '^[[:space:]]*(#|$)' .env.production.public)

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}
          build-args: |
            NEXT_PUBLIC_KAKAO_CLIENT_ID=${{ env.NEXT_PUBLIC_KAKAO_CLIENT_ID }}
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ env.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ env.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ env.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    concurrency: server-production
    environment:
      name: production
    # 헬스 게이트 내부 폴링이 최대 5분 — SSH·업로드 오버헤드 포함 여유
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_SSH_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '${DEPLOY_PATH}'"
          scp -i ~/.ssh/deploy_key -P "$SERVER_SSH_PORT" \
            deploy/server/docker-compose.yml \
            "$SERVER_USER@$SERVER_HOST:${DEPLOY_PATH}/"

      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
          KISTA_UI_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' KISTA_UI_IMAGE='${KISTA_UI_IMAGE}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" << 'ENDSSH'
            set -e
            cd "${DEPLOY_PATH}"

            # 필수 환경변수 존재 검증 (.env 서버 직접 관리)
            for key in UI_DOMAIN API_BASE_URL; do
              grep -q "^${key}=" .env || { echo "::error::필수 환경변수 누락: ${key}"; exit 1; }
            done

            # 현재 이미지 저장 (롤백용)
            PREV_IMAGE=$(docker compose ps kista-ui --format '{{.Image}}' 2>/dev/null || echo "")
            echo "$PREV_IMAGE" > /tmp/kista-ui-prev-image

            # GHCR 로그인 + kista-ui 배포
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export KISTA_UI_IMAGE
            docker compose pull kista-ui
            # shared_net은 kista-infra가 생성하는 external 네트워크 — kista-infra가 아직 안 뜬 최초 배포 순서 방어
            docker network create shared_net 2>/dev/null || true
            docker compose up -d --no-deps kista-ui
          ENDSSH

      - name: Health gate & auto-rollback
        if: always()
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" << 'ENDSSH'
            set -e
            cd "${DEPLOY_PATH}"

            echo "헬스 게이트 시작 (최대 5분)..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' kista-ui 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "✓ 헬스체크 통과 (${i}회 시도)"
                docker image prune -f || true
                exit 0
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "✗ 헬스체크 실패 (unhealthy, ${i}회 시도)"
                break
              fi
              echo "  대기 중... (${i}/30, 상태: ${STATUS})"
              sleep 10
            done

            # 헬스체크 실패 → 이전 이미지로 자동 롤백
            PREV_IMAGE=$(cat /tmp/kista-ui-prev-image 2>/dev/null || echo "")
            if [ -n "$PREV_IMAGE" ]; then
              echo "✗ 헬스체크 실패 — 이전 이미지로 롤백: $PREV_IMAGE"
              export KISTA_UI_IMAGE="$PREV_IMAGE"
              docker compose up -d --no-deps kista-ui
            else
              echo "✗ 헬스체크 실패 — 이전 이미지 정보 없음, 수동 복구 필요"
            fi
            exit 1
          ENDSSH
