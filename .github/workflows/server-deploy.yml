name: Server Deploy

# workflow_dispatch 최초 수동 배포 성공(2026-08-04) 후 kista-api/fida와 동일하게 push:main 자동 배포로 전환.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: /opt/kista-ui

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

  build:
    name: Build & Push Image
    # 배포 대상(OCI)이 arm64라 네이티브 arm64 러너에서 빌드한다(public 레포 무료).
    # x86 러너 + QEMU 에뮬레이션은 느리고(8~17분) Next.js 빌드 워커가 간헐적으로 "Illegal instruction"(SIGILL)으로
    # 크래시해(2026-08-04 무한 대기, 2026-09-30 빌드 실패) 2026-09-30 전환했다.
    # 주의: 레포를 private으로 바꾸면 이 러너는 유료/미할당이라 job이 시작조차 안 되고 무한 대기한다.
    runs-on: ubuntu-24.04-arm
    needs: verify
    # gha 캐시 미스(러너 전환 직후 첫 빌드 포함) 시 콜드 빌드가 길어질 수 있어 여유를 둔다.
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image name
        id: image
        run: |
          # SHA 태그만 — 배포·롤백 모두 SHA로 식별하고 :latest는 어디서도 쓰지 않는다
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load public NEXT_PUBLIC_* build values
        # NEXT_PUBLIC_* 9개는 클라이언트 번들에 그대로 노출되는 공개값이라 평문 파일로 레포에 커밋되어 있음(.env.production.public) —
        # 더 이상 GitHub Secrets를 참조하지 않고 파일에서 읽어 GITHUB_ENV로 로드한다.
        # 주석/빈 줄은 GITHUB_ENV 파서가 KEY=VALUE 형식이 아니면 거부하므로 반드시 걸러낸다.
        # 값이 비어 있으면(레포 커밋 시점 플레이스홀더 그대로 방치된 경우) 클라이언트 번들에 빈 값이 조용히
        # 인라인되는 사고를 막기 위해 빌드 자체를 실패시킨다 — 실제 값은 사용자가 .env.production.public을
        # 직접 채워야 한다.
        run: |
          grep -vE '^[[:space:]]*(#|$)' .env.production.public >> "$GITHUB_ENV"
          while IFS='=' read -r k v; do
            [ -n "$v" ] || { echo "::error::.env.production.public 값 미기입: ${k}"; exit 1; }
          done < <(grep -vE '^[[:space:]]*(#|$)' .env.production.public)

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            NEXT_PUBLIC_KAKAO_CLIENT_ID=${{ env.NEXT_PUBLIC_KAKAO_CLIENT_ID }}
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ env.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ env.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ env.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    concurrency: server-production
    environment:
      name: production
    # 헬스 게이트 내부 폴링이 최대 5분 — SSH·업로드 오버헤드 포함 여유
    timeout-minutes: 12
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
      # 롤백 기록을 이 run 시도에 묶는 식별자 — 다른 run이 남긴 기록으로 엉뚱하게 롤백하는 것 방지
      RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST_KEYS: ${{ secrets.SERVER_SSH_HOST_KEYS }}
        run: |
          # 호스트 키는 secret에 고정된 값만 신뢰(ssh-keyscan TOFU 금지) — 값은 "<keytype> <base64>" 한 줄씩, 호스트명 없이
          [ -n "$HOST_KEYS" ] || { echo "::error::SERVER_SSH_HOST_KEYS secret 미설정"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ "$SERVER_SSH_PORT" = "22" ]; then entry="$SERVER_HOST"; else entry="[$SERVER_HOST]:$SERVER_SSH_PORT"; fi
          while IFS= read -r key; do
            if [ -n "$key" ]; then printf '%s %s\n' "$entry" "$key"; fi
          done < <(tr -d '\r' <<<"$HOST_KEYS") > ~/.ssh/known_hosts   # CRLF로 붙여넣은 secret 방어

      - name: Upload deployment files
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '${DEPLOY_PATH}/rollback'"
          # 스테이징 파일명으로 올리고 deploy 스텝에서 롤백 기록 후 교체 — 교체 전 compose 파일을 롤백용으로 보존하기 위함
          scp -i ~/.ssh/deploy_key -P "$SERVER_SSH_PORT" \
            deploy/server/docker-compose.yml \
            "$SERVER_USER@$SERVER_HOST:${DEPLOY_PATH}/docker-compose.yml.new"

      - name: Deploy application
        id: deploy
        env:
          KISTA_UI_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' KISTA_UI_IMAGE='${KISTA_UI_IMAGE}' RUN_TAG='${RUN_TAG}' bash -s" << 'ENDSSH'
            set -e
            cd "${DEPLOY_PATH}"

            # 필수 환경변수 존재 검증 (.env는 kista-infra 배포가 렌더링)
            for key in UI_DOMAIN API_BASE_URL; do
              grep -q "^${key}=" .env || { echo "::error::필수 환경변수 누락: ${key}"; exit 1; }
            done

            # 롤백 기록: 교체 직전 compose 파일·실행 이미지. /tmp가 아닌 배포 디렉토리에 둬 재부팅에도 유지
            cp docker-compose.yml rollback/kista-ui.compose.yml 2>/dev/null || true
            docker inspect -f '{{.Config.Image}}' kista-ui > rollback/kista-ui.image 2>/dev/null || : > rollback/kista-ui.image
            mv docker-compose.yml.new docker-compose.yml

            # GHCR 패키지가 public이라 로그인 없이 pull — 토큰을 원격 커맨드라인(/proc)에 싣지 않는다
            # 예전 배포가 남긴 만료 토큰이 ~/.docker/config.json에 있으면 익명 대신 그걸로 인증해 'denied'가 난다 — 매번 제거
            docker logout ghcr.io >/dev/null 2>&1 || true
            export KISTA_UI_IMAGE
            docker compose pull kista-ui
            # shared_net은 kista-infra가 생성하는 external 네트워크 — kista-infra가 아직 안 뜬 최초 배포 순서 방어
            docker network create shared_net 2>/dev/null || true
            # 이 시점부터 컨테이너가 교체되므로 헬스 게이트가 롤백 대상으로 인식하도록 run 식별자 기록
            echo "${RUN_TAG}" > rollback/kista-ui.run
            docker compose up -d --no-deps kista-ui
          ENDSSH

      # deploy가 실패해도(up 도중 실패 등) 컨테이너 교체가 시작됐다면 롤백해야 하므로 실행 — 교체 여부는 run 식별자로 판정
      - name: Health gate & auto-rollback
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' RUN_TAG='${RUN_TAG}' bash -s" << 'ENDSSH'
            set -e
            cd "${DEPLOY_PATH}"

            if [ "$(cat rollback/kista-ui.run 2>/dev/null)" != "${RUN_TAG}" ]; then
              echo "✗ 이번 run에서 kista-ui 컨테이너 교체가 시작되지 않음 — 게이트·롤백 생략"
              exit 1
            fi

            echo "헬스 게이트 시작 (최대 5분)..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' kista-ui 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "✓ 헬스체크 통과 (${i}회 시도)"
                # 미사용 이미지 중 7일 지난 것만 정리 — dangling만 지우는 prune -f로는 SHA 태그 이미지가 무한 누적된다.
                # 다른 레포 prune이 롤백 대상 이미지를 지워도 compose up이 GHCR(public)에서 다시 pull한다
                docker image prune -af --filter "until=168h" || true
                exit 0
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "✗ 헬스체크 실패 (unhealthy, ${i}회 시도)"
                break
              fi
              echo "  대기 중... (${i}/30, 상태: ${STATUS})"
              sleep 10
            done

            # 헬스체크 실패 → 이미지와 compose 파일을 교체 직전 상태로 자동 롤백
            PREV_IMAGE=$(cat rollback/kista-ui.image 2>/dev/null || echo "")
            if [ -n "$PREV_IMAGE" ]; then
              COMPOSE_FILE_PREV=rollback/kista-ui.compose.yml
              [ -f "$COMPOSE_FILE_PREV" ] || COMPOSE_FILE_PREV=docker-compose.yml
              echo "✗ 헬스체크 실패 — 롤백: $PREV_IMAGE ($COMPOSE_FILE_PREV)"
              KISTA_UI_IMAGE="$PREV_IMAGE" docker compose -p "$(basename "${DEPLOY_PATH}")" \
                --project-directory "${DEPLOY_PATH}" -f "$COMPOSE_FILE_PREV" up -d --no-deps kista-ui
            else
              echo "✗ 헬스체크 실패 — 이전 이미지 정보 없음, 수동 복구 필요"
            fi
            exit 1
          ENDSSH
