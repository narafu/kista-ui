name: Server Deploy

# workflow_dispatch 최초 수동 배포 성공(2026-08-04) 후 kista-api/fida와 동일하게 push:main 자동 배포로 전환.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: /opt/kista-ui

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

  # 배포 스크립트 정적 분석·단위 테스트 — 서버를 건드리는 스크립트가 여길 통과해야 이미지를 만든다
  deploy-checks:
    name: Deploy Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: shellcheck deploy/server/bin/*.sh .github/tests/stub/docker
      - name: bats
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats >/dev/null
          bats .github/tests

  build:
    name: Build & Push Image
    # 배포 대상(OCI)이 arm64라 네이티브 arm64 러너에서 빌드한다(public 레포 무료).
    # x86 러너 + QEMU 에뮬레이션은 느리고(8~17분) Next.js 빌드 워커가 간헐적으로 "Illegal instruction"(SIGILL)으로
    # 크래시해(2026-08-04 무한 대기, 2026-09-30 빌드 실패) 2026-09-30 전환했다.
    # 주의: 레포를 private으로 바꾸면 이 러너는 유료/미할당이라 job이 시작조차 안 되고 무한 대기한다.
    runs-on: ubuntu-24.04-arm
    needs: [verify, deploy-checks]
    # gha 캐시 미스(러너 전환 직후 첫 빌드 포함) 시 콜드 빌드가 길어질 수 있어 여유를 둔다.
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image name
        id: image
        run: |
          # SHA 태그만 — 배포·롤백 모두 SHA로 식별하고 :latest는 어디서도 쓰지 않는다
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load public NEXT_PUBLIC_* build values
        # NEXT_PUBLIC_* 9개는 클라이언트 번들에 그대로 노출되는 공개값이라 평문 파일로 레포에 커밋되어 있음(.env.production.public) —
        # 더 이상 GitHub Secrets를 참조하지 않고 파일에서 읽어 GITHUB_ENV로 로드한다.
        # 주석/빈 줄은 GITHUB_ENV 파서가 KEY=VALUE 형식이 아니면 거부하므로 반드시 걸러낸다.
        # 값이 비어 있으면(레포 커밋 시점 플레이스홀더 그대로 방치된 경우) 클라이언트 번들에 빈 값이 조용히
        # 인라인되는 사고를 막기 위해 빌드 자체를 실패시킨다 — 실제 값은 사용자가 .env.production.public을
        # 직접 채워야 한다.
        run: |
          grep -vE '^[[:space:]]*(#|$)' .env.production.public >> "$GITHUB_ENV"
          while IFS='=' read -r k v; do
            [ -n "$v" ] || { echo "::error::.env.production.public 값 미기입: ${k}"; exit 1; }
          done < <(grep -vE '^[[:space:]]*(#|$)' .env.production.public)

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            NEXT_PUBLIC_KAKAO_CLIENT_ID=${{ env.NEXT_PUBLIC_KAKAO_CLIENT_ID }}
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ env.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ env.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ env.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    concurrency: server-production
    environment:
      name: production
    # 헬스 게이트 내부 폴링이 최대 5분 — SSH·업로드 오버헤드 포함 여유
    timeout-minutes: 12
    env:
      # 롤백 기록을 이 run 시도에 묶는 식별자 — 다른 run이 남긴 기록으로 엉뚱하게 롤백하는 것 방지
      RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/ssh-setup
        with:
          ssh-key: ${{ secrets.SERVER_SSH_KEY }}
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          host-keys: ${{ secrets.SERVER_SSH_HOST_KEYS }}
          user: ${{ secrets.SERVER_USER }}

      - name: Upload deployment files
        run: |
          remote "mkdir -p '${DEPLOY_PATH}/rollback' '${DEPLOY_PATH}/bin'"
          upload deploy/server/bin/*.sh "${DEPLOY_PATH}/bin/"
          # 스테이징 파일명으로 올리고 deploy.sh가 롤백 기록 후 교체 — 교체 전 compose 파일을 롤백용으로 보존하기 위함
          upload deploy/server/docker-compose.yml "${DEPLOY_PATH}/docker-compose.yml.new"

      - name: Deploy application
        id: deploy
        env:
          KISTA_UI_IMAGE: ${{ needs.build.outputs.image }}
        run: remote "DEPLOY_PATH='${DEPLOY_PATH}' KISTA_UI_IMAGE='${KISTA_UI_IMAGE}' RUN_TAG='${RUN_TAG}' bash '${DEPLOY_PATH}/bin/deploy.sh'"

      # deploy가 실패해도(up 도중 실패 등) 컨테이너 교체가 시작됐다면 롤백해야 하므로 실행 — 교체 여부는 run 식별자로 판정
      - name: Health gate & auto-rollback
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        env:
          KISTA_UI_IMAGE: ${{ needs.build.outputs.image }}
        run: remote "DEPLOY_PATH='${DEPLOY_PATH}' KISTA_UI_IMAGE='${KISTA_UI_IMAGE}' RUN_TAG='${RUN_TAG}' bash '${DEPLOY_PATH}/bin/health-gate.sh'"
