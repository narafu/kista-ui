name: React Doctor

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SHA 고정: 이 액션은 위 permissions의 토큰(github.token)을 암묵적으로 사용한다 — 브랜치 참조면 업스트림 변경이 즉시 실행됨
      - uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2.2.9
